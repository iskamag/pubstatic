# ActivityPub Blog - Nginx Configuration
# This configuration integrates the blog with an existing static website.
# WebFinger stays at /.well-known/webfinger, and all other app routes live under BLOG_PATH.
# 
# SETUP:
# 1. Copy this file to /etc/nginx/sites-available/blog
# 2. Update DOMAIN, paths, and ports as needed
# 3. Enable: sudo ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
# 4. Reload nginx: sudo nginx -s reload

# HTTP to HTTPS redirect (uncomment if using SSL)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name blog.example.com;
#     return 301 https://$host$request_uri;
# }

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.example.com;

    ssl_session_timeout 1d;
    ssl_session_cache shared:ssl_session_cache:10m;
    ssl_session_tickets off;

    # SSL certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 80m;

    # Root for static files (your existing website)
    root /var/www/html;

    # Static content from your existing website
    location / {
        try_files $uri $uri/ =404;
    }

    # Redirect /posts to /posts/ so relative asset URLs resolve correctly.
    # Change /posts to match BLOG_PATH without the trailing slash.
    location = /posts {
        return 301 /posts/;
    }

    # Proxy the entire app under BLOG_PATH.
    # Change /posts/ to match BLOG_PATH with the trailing slash.
    # This covers the blog UI, post pages, ActivityPub endpoints, RSS, and static assets.
    location /posts/ {
        proxy_pass http://localhost:6767;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebFinger stays at root.
    location /.well-known/webfinger {
        proxy_pass http://localhost:6767;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
